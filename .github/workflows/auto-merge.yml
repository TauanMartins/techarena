name: Enable auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  enable:
    # This privileged workflow never checks out or executes code from a PR.
    # Only the repository owner's same-repository, ready PRs are automatic.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.RELEASE_APP_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const {data: rules} = await github.request('GET /repos/{owner}/{repo}/rules/branches/main', context.repo);
            if (!rules.some(rule => rule.type === 'required_status_checks' &&
                rule.parameters.required_status_checks.some(check => check.context === 'CI'))) {
              throw new Error('Require CI in the main ruleset first. No merge was requested.');
            }
            await github.graphql(`mutation($id: ID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                pullRequest { number }
              }
            }`, {id: context.payload.pull_request.node_id});
