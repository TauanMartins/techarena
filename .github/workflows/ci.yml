name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected components
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.select.outputs.frontend }}
      backend: ${{ steps.select.outputs.backend }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks
        id: select
        run: python3 .github/scripts/select_checks.py

  checks:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    name: ${{ matrix.component }} / lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - name: Install npm and dependencies
        run: |
          npm install --global "npm@$(cat ../.npm-version)"
          npm ci --include=dev
      - name: Lint
        run: npm run lint
      - name: Check formatting
        if: matrix.component == 'frontend'
        run: npm run format:check
      - name: Tests and coverage
        run: ${{ matrix.test-command }}
      - name: Production build
        run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.component }}
          path: ${{ matrix.component }}/coverage/
          if-no-files-found: ignore
          retention-days: 7

  integration:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    name: Backend / integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:15-3.6-alpine
        env:
          POSTGRES_DB: techarena_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d techarena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/techarena_test
      CORS_ORIGINS: http://localhost:4200
      SUPABASE_URL: https://project.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install npm and dependencies
        run: |
          npm install --global "npm@$(cat ../.npm-version)"
          npm ci --include=dev
      - name: Prepare disposable database
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:check
      - name: Integration tests
        run: npm run test:e2e

  automation:
    name: Automation / tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
      - name: Lint GitHub Actions workflows
        run: bash .github/scripts/lint_workflows.sh
      - name: Validate release configuration and deployment logic
        run: |
          python3 -m json.tool release-please-config.json > /dev/null
          python3 -m json.tool .release-please-manifest.json > /dev/null
          python3 -m unittest discover -s .github/tests -v

  ci:
    name: CI
    if: always()
    needs: [changes, checks, integration, automation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Summarize and require successful checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/require_checks.py

  auto-merge:
    name: Enable auto-merge after CI
    needs: [ci]
    # Only trusted same-repository PRs receive an App token. No checkout here.
    if: >-
      github.event_name == 'pull_request' &&
      needs.ci.result == 'success' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create auto-merge token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Enable protected squash merge
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const expected = context.payload.pull_request;
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: expected.number
            });
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                pr.user.login !== context.repo.owner ||
                pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pr.head.sha !== expected.head.sha) {
              core.info('PR changed or is no longer eligible. Its current CI must approve it.');
              return;
            }
            if (pr.auto_merge) {
              core.info('Auto-merge is already enabled.');
              return;
            }
            const {data: rules} = await github.request(
              'GET /repos/{owner}/{repo}/rules/branches/main', context.repo
            );
            if (!['CI', 'Conventional PR title'].every(name => rules.some(rule =>
                rule.type === 'required_status_checks' &&
                rule.parameters.required_status_checks.some(check => check.context === name)))) {
              throw new Error('Require CI and Conventional PR title in the main ruleset first. No merge was requested.');
            }
            await github.graphql(`mutation($id: ID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                pullRequest { number }
              }
            }`, {id: pr.node_id});
            await core.summary.addRaw(`Auto-merge enabled for PR #${pr.number}, subject to branch protections.`).write();
