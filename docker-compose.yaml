services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techarena_backend
    restart: unless-stopped
    command: sh -c "npm install && npm run start:dev"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
