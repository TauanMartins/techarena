services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techarena_frontend
    restart: unless-stopped
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 4200"
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:3000/api}"
      VITE_SUPABASE_URL: "${SUPABASE_URL:-}"
      VITE_SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY:-}"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techarena_backend
    restart: unless-stopped
    command: sh -c "npm install && npm run start:dev"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      SUPABASE_URL: "${SUPABASE_URL:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:4200}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:secret@postgres:5432/techarena}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgis/postgis:15-3.6-alpine
    container_name: techarena_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: techarena
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techarena"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
